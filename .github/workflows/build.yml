# This is a basic workflow that is manually triggered

name: compile chihuahua

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on: [push, pull_request, workflow_dispatch]

# This workflow makes x86_64 binaries for mac, windows, and linux.

# Force the exact pinned Go toolchain. The `toolchain` directive in go.mod only
# ever upgrades the toolchain, never downgrades it, so a runner with a newer Go
# (>=1.25) would otherwise be used and fail to compile the transitive
# bytedance/sonic dependency. GOTOOLCHAIN=go1.23.9 pins it precisely (Go
# downloads that toolchain on demand).
env:
  GOTOOLCHAIN: "go1.23.9"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        targetos: [darwin, linux]
        include:
          - targetos: windows
            arch: amd64
    name: chihuahua ${{ matrix.arch }} for ${{ matrix.targetos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the Go version from go.mod so CI honors the pinned
          # `toolchain go1.23.9`. Do NOT hardcode a floating version like
          # "^1.22": newer Go (>=1.25) fails to compile the transitive
          # bytedance/sonic dependency used by this SDK/CometBFT line.
          go-version-file: "go.mod"
          check-latest: false
        env:
          GOOS: ${{ matrix.targetos }}
          GOARCH: ${{ matrix.arch }}

      - name: run tests
        run: go test ./...

      # we build and install in case we want to run it or capture an artifact as we do in the step below.
      - name: Compile chihuahuad
        run: |
          go build ./...
          go install ./...

      # now uploads genesis.json and bin
      - uses: actions/upload-artifact@v4
        with:
          name: chihuahuad ${{ matrix.targetos }} ${{ matrix.arch }}
          path: cmd/chihuahuad
