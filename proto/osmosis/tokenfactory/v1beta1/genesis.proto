syntax = "proto3";
package osmosis.tokenfactory.v1beta1;

import "gogoproto/gogo.proto";
import "osmosis/tokenfactory/v1beta1/authorityMetadata.proto";
import "osmosis/tokenfactory/v1beta1/params.proto";
import "osmosis/tokenfactory/v1beta1/stakedrop.proto";

option go_package = "github.com/ChihuahuaChain/chihuahua/x/tokenfactory/types";

// GenesisState defines the tokenfactory module's genesis state.
message GenesisState {
  // params defines the paramaters of the module.
  Params params = 1 [ (gogoproto.nullable) = false ];

  repeated GenesisDenom factory_denoms = 2 [
    (gogoproto.moretags) = "yaml:\"factory_denoms\"",
    (gogoproto.nullable) = false
  ];

  // active_stakedrops are the stakedrops that have not been paid out and
  // removed yet, together with the escrow they still hold.
  repeated GenesisStakedrop active_stakedrops = 3 [
    (gogoproto.moretags) = "yaml:\"active_stakedrops\"",
    (gogoproto.nullable) = false
  ];

  // stakedrop_sequence is the next value of the stakedrop key sequence.
  uint64 stakedrop_sequence = 4
      [ (gogoproto.moretags) = "yaml:\"stakedrop_sequence\"" ];
}

// GenesisStakedrop is an active stakedrop and the sequence part of its store
// key. The other part of the key is the stakedrop start block.
message GenesisStakedrop {
  uint64 sequence = 1 [ (gogoproto.moretags) = "yaml:\"sequence\"" ];
  Stakedrop stakedrop = 2 [
    (gogoproto.moretags) = "yaml:\"stakedrop\"",
    (gogoproto.nullable) = false
  ];
}

// GenesisDenom defines a tokenfactory denom that is defined within genesis
// state. The structure contains DenomAuthorityMetadata which defines the
// denom's admin.
message GenesisDenom {
  option (gogoproto.equal) = true;

  string denom = 1 [ (gogoproto.moretags) = "yaml:\"denom\"" ];
  DenomAuthorityMetadata authority_metadata = 2 [
    (gogoproto.moretags) = "yaml:\"authority_metadata\"",
    (gogoproto.nullable) = false
  ];
}